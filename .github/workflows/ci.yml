name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            pacotes: gcc
          # libclang-rt-dev traz o runtime dos sanitizers usados em `make test`
          - cc: clang
            pacotes: clang libclang-rt-dev
    env:
      CC: ${{ matrix.cc }}
      # Fontes que ainda não compilam (nenhum no momento). Cada entrada deve
      # citar a issue que a resolve.
      KNOWN_BROKEN: ""
      # Headers que ainda não compilam sozinhos (nenhum no momento).
      KNOWN_BROKEN_HEADERS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libcurl4-openssl-dev ${{ matrix.pacotes }}

      - name: Arquivos gerados atualizados
        if: matrix.cc == 'gcc'
        run: |
          python3 tools/gerar_enderecos.py --verificar
          python3 tools/gerar_padroes.py --verificar
          python3 tools/gerar_esquemas.py --verificar
          # Outro documento (schema fictício de tests/schemas/exemplo)
          doc=tests/outro_documento/documento.json
          python3 tools/gerar_padroes.py --config "$doc" --verificar
          python3 tools/gerar_esquemas.py --config "$doc" --verificar
          python3 tools/gerar_diagramas.py --config "$doc" --todo
          python3 tools/gerar_diagramas.py --todo
          python3 tests/schemas/gerar_tipos_xsd.py
          git diff --exit-code -- docs/diagramas TODO.md tests/schemas tests/outro_documento || {
            echo "::error::Arquivos gerados desatualizados: rode python3 tools/gerar_diagramas.py --todo e python3 tests/schemas/gerar_tipos_xsd.py"
            exit 1
          }

      - name: Compilar
        run: sh .github/scripts/compilar.sh

      - name: Testes
        run: make test

      - name: Exemplos
        run: |
          make exemplos
          ./obj/gerar_ide > /dev/null
          ./obj/gerar_nfe > /dev/null
          ./obj/assinar_nfe tests/certificados/teste.pfx teste > /dev/null
          ./obj/nfe_ibscbs tests/certificados/teste.pfx teste > /dev/null

      - name: Instalação
        run: |
          destino="$RUNNER_TEMP/destino"
          make install DESTDIR="$destino" PREFIX=/usr C_SOURCE="$(ls obj/*.o | sed 's|^obj/|src/libnfe/|; s|\.o$|.c|')"
          test -f "$destino/usr/lib/libnfe.so.1.0.0"
          test -L "$destino/usr/lib/libnfe.so.1"
          test -L "$destino/usr/lib/libnfe.so"
          test -f "$destino/usr/include/libnfe/nfe.h"
          test -f "$destino/usr/lib/pkgconfig/libnfe.pc"
          grep -qx 'prefix=/usr' "$destino/usr/lib/pkgconfig/libnfe.pc"
          readelf -d "$destino/usr/lib/libnfe.so.1.0.0" | grep -q 'SONAME.*libnfe\.so\.1'
          # Motor de grupos exportado; as tabelas da NF-e, não
          nm -D --defined-only "$destino/usr/lib/libnfe.so.1.0.0" | grep -q ' nfe_grupo_new$'
          ! nm -D --defined-only "$destino/usr/lib/libnfe.so.1.0.0" | grep -q ' esq_'
          test -f "$destino/usr/share/tooldoce/ferramentas/gerar_esquemas.py"
          make uninstall DESTDIR="$destino" PREFIX=/usr
          test -z "$(find "$destino" -type f -o -type l)"

      # Programa externo compilado só com as flags do libnfe.pc. A instalação
      # vai para um prefixo real (sem DESTDIR) para que os caminhos do .pc
      # apontem para os arquivos instalados.
      - name: pkg-config
        run: |
          prefixo="$RUNNER_TEMP/prefixo"
          make install PREFIX="$prefixo" C_SOURCE="$(ls obj/*.o | sed 's|^obj/|src/libnfe/|; s|\.o$|.c|')"
          export PKG_CONFIG_PATH="$prefixo/lib/pkgconfig"
          versao=$(sed -n 's/^#define NFE_VERSAO  *"\(.*\)"/\1/p' include/libnfe/versao.h)
          test "$(pkg-config --modversion libnfe)" = "$versao"
          $CC -std=c99 -Wall -Werror examples/gerar_nfe.c $(pkg-config --cflags --libs libnfe) -Wl,-rpath,"$prefixo/lib" -o "$RUNNER_TEMP/gerar_nfe"
          "$RUNNER_TEMP/gerar_nfe" > /dev/null
          # Geradores instalados, como uma biblioteca de outro documento os usa
          ferramentas=$(pkg-config --variable=ferramentas libnfe)
          python3 "$ferramentas/gerar_esquemas.py" --config tests/outro_documento/documento.json --verificar
          python3 "$ferramentas/gerar_padroes.py" --config tests/outro_documento/documento.json --verificar
          make uninstall PREFIX="$prefixo"
          test -z "$(find "$prefixo" -type f -o -type l)"
